# Configuración de despliegue en Netlify
[build]
  command = "npm run build"
  publish = "dist"

# SPA: todas las rutas sirven index.html (React Router se encarga del resto)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras seguras. HTTPS lo provee Netlify (necesario para Web NFC).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
